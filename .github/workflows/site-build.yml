name: site build

# Builds the Astro site so a compile error surfaces here, not at swap-over
# time. Deliberately separate from deploy-pages.yml: this job cannot break the
# live Next app because it neither deploys nor touches its build.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'lib/**'
  pull_request:
    paths:
      - 'site/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: site
        run: npm run build

      - name: Report output
        working-directory: site
        run: |
          echo "Built files:"
          find dist -type f | head -40
          echo "Total size: $(du -sh dist | cut -f1)"
