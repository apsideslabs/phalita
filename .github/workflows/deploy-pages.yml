name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---- the engine gates --------------------------------------------
      - name: Install tooling
        run: npm install --no-audit --no-fund

      - name: Type check the engine
        run: npx tsc --noEmit

      - name: Verify the verse corpus
        run: |
          if [ -f scripts/run-check-phala.mjs ]; then
            node scripts/run-check-phala.mjs
          else
            echo 'no corpus check script present; skipping'
          fi

      - name: Verify the ephemeris
        run: |
          if [ -f scripts/check-ephemeris.py ]; then
            pip install --quiet pymeeus==0.5.12 ephem==4.1.5
            python3 scripts/check-ephemeris.py
          else
            echo 'no ephemeris check present; skipping'
          fi

      # ---- the place index ----------------------------------------------
      # GeoNames is CC BY 4.0 and cannot be committed: the data runs to ~47 MB.
      # CI has open network, so the index is rebuilt on every deploy instead.
      - name: Build the place index
        run: |
          set -e
          mkdir -p /tmp/gn /tmp/placebuild/public
          base=https://download.geonames.org/export/dump
          curl -sSL --retry 3 -o /tmp/gn/cities5000.zip      $base/cities5000.zip
          curl -sSL --retry 3 -o /tmp/gn/timeZones.txt       $base/timeZones.txt
          curl -sSL --retry 3 -o /tmp/gn/countryInfo.txt     $base/countryInfo.txt
          curl -sSL --retry 3 -o /tmp/gn/admin1CodesASCII.txt $base/admin1CodesASCII.txt
          unzip -qo /tmp/gn/cities5000.zip -d /tmp/gn
          # the script writes to public/data relative to its cwd; point that at web/
          ln -sfn "$GITHUB_WORKSPACE/web" /tmp/placebuild/public/data
          cd /tmp/placebuild
          GN_DIR=/tmp/gn node "$GITHUB_WORKSPACE/scripts/build-cities.mjs"
          ls -la "$GITHUB_WORKSPACE/web/data" | head

      # ---- the site -----------------------------------------------------
      - name: Bundle the engine for the browser
        run: npm run bundle

      - name: Disable Jekyll
        run: touch web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
