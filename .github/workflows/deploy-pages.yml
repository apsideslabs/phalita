name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---- the engine gates --------------------------------------------
      - name: Install engine dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check the engine
        run: npx tsc --noEmit

      - name: Verify the verse corpus
        run: |
          if [ -f scripts/run-check-phala.mjs ]; then
            node scripts/run-check-phala.mjs
          else
            echo 'no corpus check script present; skipping'
          fi

      - name: Verify the ephemeris
        run: |
          if [ -f scripts/check-ephemeris.py ]; then
            pip install --quiet pymeeus==0.5.12 ephem==4.1.5
            python3 scripts/check-ephemeris.py
          else
            echo 'no ephemeris check present; skipping'
          fi

      # ---- the bundle ---------------------------------------------------
      - name: Install esbuild
        run: npm install --no-save --no-audit --no-fund esbuild

      - name: Bundle the engine for the browser
        run: |
          npx esbuild web/src/entry.ts \
            --bundle \
            --format=iife \
            --minify \
            --target=es2019 \
            --tsconfig=tsconfig.json \
            --outfile=web/js/engine.js
          ls -lh web/js/engine.js

      - name: Disable Jekyll
        run: touch web/.nojekyll

      - name: Report output
        run: |
          find web -maxdepth 2 -type f | sort | head -30
          echo "total: $(du -sh web | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
