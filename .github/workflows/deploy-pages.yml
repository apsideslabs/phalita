name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---- the engine gates --------------------------------------------
      - name: Install tooling
        run: npm install --no-audit --no-fund

      - name: Type check the engine
        run: npx tsc --noEmit

      - name: Verify the verse corpus
        run: |
          if [ -f scripts/run-check-phala.mjs ]; then
            node scripts/run-check-phala.mjs
          else
            echo 'no corpus check script present; skipping'
          fi

      - name: Verify the ephemeris
        run: |
          if [ -f scripts/check-ephemeris.py ]; then
            pip install --quiet pymeeus==0.5.12 ephem==4.1.5
            python3 scripts/check-ephemeris.py
          else
            echo 'no ephemeris check present; skipping'
          fi

      # ---- the place index ----------------------------------------------
      # GeoNames is CC BY 4.0 and cannot be committed. The India extract alone
      # is ~90 MB zipped and unzips to ~300 MB, so the index is rebuilt on every
      # deploy. IN.txt carries every populated place in India — 5.5 lakh
      # villages — which is what makes village-name birthplaces searchable.
      - name: Build the place index
        run: |
          set -e
          mkdir -p /tmp/gn /tmp/placebuild/public
          base=https://download.geonames.org/export/dump

          for f in cities5000.zip cities1000.zip cities500.zip IN.zip; do
            echo "fetching $f"
            curl -sSL --retry 3 --retry-delay 2 -o "/tmp/gn/$f" "$base/$f"
          done
          for f in timeZones.txt countryInfo.txt admin1CodesASCII.txt admin2Codes.txt; do
            echo "fetching $f"
            curl -sSL --retry 3 --retry-delay 2 -o "/tmp/gn/$f" "$base/$f"
          done

          unzip -qo /tmp/gn/cities5000.zip -d /tmp/gn
          unzip -qo /tmp/gn/cities1000.zip -d /tmp/gn
          unzip -qo /tmp/gn/cities500.zip  -d /tmp/gn
          unzip -qo /tmp/gn/IN.zip         -d /tmp/gn

          echo '--- inputs ---'
          ls -la /tmp/gn/*.txt | awk '{print $5, $9}'

          # the script writes to public/data relative to its cwd; point that at web/
          ln -sfn "$GITHUB_WORKSPACE/web" /tmp/placebuild/public/data
          cd /tmp/placebuild
          GN_DIR=/tmp/gn node "$GITHUB_WORKSPACE/scripts/build-cities.mjs"

          echo '--- output ---'
          ls -la "$GITHUB_WORKSPACE/web" | head
          echo "shards: $(ls "$GITHUB_WORKSPACE/web/in" 2>/dev/null | wc -l)"
          du -sh "$GITHUB_WORKSPACE/web/in" 2>/dev/null || true

      # ---- the site -----------------------------------------------------
      - name: Bundle the engine for the browser
        run: npm run bundle

      - name: Disable Jekyll
        run: touch web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
