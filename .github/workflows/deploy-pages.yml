name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ---- the engine gates --------------------------------------------
      - name: Install engine dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check the engine
        run: npx tsc --noEmit

      - name: Verify the verse corpus
        run: |
          if [ -f scripts/run-check-phala.mjs ]; then
            node scripts/run-check-phala.mjs
          else
            echo 'no corpus check script present; skipping'
          fi

      - name: Verify the ephemeris
        run: |
          if [ -f scripts/check-ephemeris.py ]; then
            pip install --quiet pymeeus==0.5.12 ephem==4.1.5
            python3 scripts/check-ephemeris.py
          else
            echo 'no ephemeris check present; skipping'
          fi

      # ---- the site ----------------------------------------------------
      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build the site
        working-directory: site
        run: npm run build

      - name: Disable Jekyll
        run: touch site/dist/.nojekyll

      - name: Report output
        working-directory: site
        run: |
          find dist -type f | head -30
          echo "total: $(du -sh dist | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
